# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=8080

# ============================================================
# DATABASE CONFIGURATION - LOCAL MySQL
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alarm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ijse@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE CONFIGURATIONS
# ============================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# CORS CONFIGURATION
# ============================================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600

# ============================================================
# SMS GATEWAY CONFIGURATION
# ============================================================
# Twilio Configuration (Comment out if using other gateway)
sms.gateway.twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
sms.gateway.twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
sms.gateway.twilio.phone-number=+1234567890

# HTTP SMS Gateway Configuration
sms.gateway.http.url=http://your-sms-gateway.com/send
sms.gateway.http.api-key=YOUR_API_KEY
sms.gateway.http.sender-id=ALARM-SYS

# SMS Gateway Type: twilio, http, or modem
sms.gateway.type=http

# application.properties - Add scheduling configuration

# Scheduling
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduled-task-

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false